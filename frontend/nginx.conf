server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Client-side routes such as /boardgames/catan exist only in the React router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite names built assets with a content hash, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
