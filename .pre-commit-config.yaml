repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key
  - repo: local
    hooks:
      - id: catalog-make-check
        name: catalog make check
        entry: make -C catalog check
        language: system
        pass_filenames: false
        files: ^catalog/
        verbose: true
      - id: frontend-make-check
        name: frontend make check
        entry: make -C frontend check
        language: system
        pass_filenames: false
        files: ^frontend/
        verbose: true
