name: Check frontend

on:
  pull_request:
    paths:
      - "frontend/**"
  workflow_call:
    inputs:
      working-directory:
        description: Directory that contains the Makefile and package.json
        type: string
        required: false
        default: frontend

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory || 'frontend' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory || 'frontend' }}/package-lock.json

      - name: Display Node version
        run: |
          node --version
          npm --version

      - name: Run make check
        run: make check
